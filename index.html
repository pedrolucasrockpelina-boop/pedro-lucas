<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Simples</title>
    <style>
        /* Estilos básicos para deixar a página agradável */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
            border-radius: 8px;
        }
        h2 {
            color: #007bff;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: #fff;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .botao {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 1rem;
        }
        .botao:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem-vindo ao Meu Site!</h1>
        <p>Acesse aqui.</p>
    </header>

    <main>
        <h2>Sobre a Página</h2>
        <p>Aqui você pode colocar a introdução do seu projeto, portfólio ou empresa.</p>
        
        <h2>Principais Recursos</h2>
        <ul>
            <li>inicie seu projeto do inicio</li>
            <li>Estilização básica </li>
            <li>Fácil personalização</li>
        </ul>

        <a href="https://google.com" target="_blank" class="botao">Visite o Google</a>
    </main>

    <footer>
        <p>&copy; 2026 Meu Site. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
